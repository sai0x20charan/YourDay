name: Release Android App

on:
  push:
    tags:
      - '*' # Triggers on any tag push (e.g. v1.0.0, 1.0.0)
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p composeApp/src/release
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > composeApp/src/release/Yourday_key.jks
          fi

      - name: Decode Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p composeApp/src/release
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > composeApp/src/release/google-services.json
            cp composeApp/src/release/google-services.json composeApp/google-services.json 2>/dev/null || true
            cp composeApp/src/release/google-services.json composeApp/src/debug/google-services.json 2>/dev/null || true
          fi

      - name: Create local.properties
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          API_KEY: ${{ secrets.API_KEY }}
          TODOIST_CLIENT_ID: ${{ secrets.TODOIST_CLIENT_ID }}
          TODOIST_CLIENT_SECRET: ${{ secrets.TODOIST_CLIENT_SECRET }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/composeApp/src/release/Yourday_key.jks"
          echo "API_KEY=$API_KEY" > local.properties
          echo "TODOIST_CLIENT_ID=$TODOIST_CLIENT_ID" >> local.properties
          echo "TODOIST_CLIENT_SECRET=$TODOIST_CLIENT_SECRET" >> local.properties
          echo "KEY_STORE_PASSWORD=$KEY_STORE_PASSWORD" >> local.properties
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          echo "KEY_ALIAS=$KEY_ALIAS" >> local.properties
          echo "KEY_LOCATION=$KEYSTORE_PATH" >> local.properties

      - name: Build Release APK & AAB
        run: ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease

      - name: Upload Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: yourday-release-artifacts
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f local.properties
          rm -f composeApp/src/release/Yourday_key.jks
          rm -f composeApp/src/release/google-services.json
